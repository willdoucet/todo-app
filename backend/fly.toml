# Fly.io deploy config for the mealy-app-prod API.
# Process groups: web (uvicorn), worker (celery jobs), beat (celery scheduler).

app = "mealy-app-prod"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"
  # Pin the Dockerfile build stage. Fly auto-selects the last FROM stage
  # otherwise — any future stage added after `prod` would silently ship.
  build_target = "prod"

[env]
  # M7 PR2 — the R2 cutover flag. Deliberately NOT a Fly secret, unlike every
  # other production env var here: it is not secret, and versioning it with the
  # code means a rollback undoes the storage flip atomically. A secret would
  # survive a code rollback, leaving PR1's code writing to R2 while reading
  # from disk — the one genuinely broken combination (see the adversarial
  # review's rollback concern and infra/r2-cutover-runbook.md).
  #
  # Reads and writes MUST flip together: an R2-written object 404s against a
  # disk-backed read.
  STORAGE_BACKEND = "r2"

  # M8 break-glass (infra/incident-diagnostics.md → Break-glass). Only the exact
  # string "1" turns it on; then the host gate skips the X-Origin-Verify check
  # (the Host check stays) and logs every admitted request as `bypassed`. For a
  # Cloudflare proxy/WAF outage with DNS still resolving (Mode A), enabled per
  # release with `fly deploy --image <running ref> -e GATE_BREAK_GLASS=1`.
  # Versioned here, never a Fly secret: a secret would survive the clearing
  # redeploy and leave the gate open. /healthz reports it as `gate_break_glass`
  # and the daily ops-check fails while it is on.
  GATE_BREAK_GLASS = "0"

[deploy]
  # Runs against the new image before web takes traffic. Migrations must be
  # backward-compatible: a release_command failure leaves the previous
  # image serving.
  release_command = "alembic upgrade head"

[processes]
  # --proxy-headers + --forwarded-allow-ips='*' make uvicorn trust Fly's
  # X-Forwarded-Proto / X-Forwarded-For. Without this, FastAPI's
  # trailing-slash redirects (and any other request.url-derived URLs)
  # use scheme=http because the Fly proxy ↔ app hop is plain HTTP, even
  # though the edge is HTTPS — producing http:// Location headers that
  # browsers block as Mixed Content from an HTTPS frontend.
  web = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*"
  # --without-gossip/--without-mingle/--without-heartbeat: all three coordinate
  # a multi-worker cluster (peer discovery, state sync, liveness events). We run
  # exactly one worker, so they buy nothing and cost Redis commands — the
  # heartbeat alone publishes every 2s against Upstash, which bills per command
  # and whose own Celery guidance warns that "Celery workers poll Redis
  # continuously, even when there is no queue activity".
  worker = "celery -A app.celery_app worker --loglevel=info --concurrency=2 --without-gossip --without-mingle --without-heartbeat"
  # Beat must be exactly one process — multiple beat instances would fire
  # the iCloud sync schedule N times every 10 min and corrupt task state.
  # Machine counts cannot be expressed in this file: they are set out-of-band
  # with `fly scale count` and pinned in infra/fly-scale.json (web=1, worker=1,
  # beat=1). `infra/release-smoke.py` check 3 diffs `fly machines list --json`
  # against that file on every release, and asserts its keys equal the
  # [processes] keys here. `min_machines_running` below is a floor, not a cap.
  # --schedule writes the shelve DB to /tmp because /app is owned by root
  # in the prod image (USER appuser cannot write the default cwd location).
  beat = "celery -A app.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule"

# Both background groups must come back on their own. The default policy is
# `on-failure`, which leaves a machine stopped after a clean exit or a
# platform-initiated stop — and `fly deploy` updates an already-stopped machine
# without starting it, so a deploy does not heal it either. On 2026-09-11 the
# worker was found stopped since at least the end of May: 32,136 scheduled jobs
# had queued in Redis, and iCloud sync plus the soft-delete purge had been dead
# for ~103 days with nothing surfacing it. Web needs no entry here — its health
# check and `min_machines_running = 1` already keep it up.
[[restart]]
  policy = "always"
  processes = ["worker", "beat"]

[[services]]
  protocol = "tcp"
  internal_port = 8000
  processes = ["web"]
  # Web stays warm: cold-start would break M4's <300ms refresh budget.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "10s"
    method = "get"
    path = "/healthz"
    protocol = "http"

[[vm]]
  size = "shared-cpu-1x"
  # M3 plan requires web ≥1 GB: argon2id at OWASP defaults consumes
  # ~64 MiB per concurrent hash (asyncio.to_thread offload, default
  # threadpool ~5 slots → ~320 MiB worst case + ~150 MiB for the rest
  # of the app). Below 1 GB the web VM OOMs under any login burst.
  memory = "1024mb"
  processes = ["web"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["worker"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["beat"]
